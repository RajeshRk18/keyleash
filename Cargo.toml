[workspace]
resolver = "3"
members = ["crates/*", "exercises/*"]

# One place to pin versions. Member crates write `tokio.workspace = true`
# and never a version number. This is how you stop three crates from
# pulling three different serde minors.
[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio            = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "io-util"] }
tokio-seqpacket  = "0.9"
rustix           = { version = "1.1", features = ["process", "net", "fs", "mm", "pipe"] }
clap             = { version = "4.6", features = ["derive"] }
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
toml             = "1.1"
age              = "0.12"
ed25519-dalek    = { version = "3.0", features = ["rand_core"] }
zeroize          = { version = "1.9", features = ["derive"] }
thiserror        = "2.0"
anyhow           = "1.0"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
insta            = "1.48"
proptest         = "1"

# Debug builds are what you run all day. Make them not-slow to link,
# and keep dependency optimisation on so age/dalek are not glacial.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1          # keep symbols: a broker you cannot profile is a broker you cannot fix
